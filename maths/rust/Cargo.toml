[package]
name = "bush-maths"
version = "0.1.0"
edition = "2021"
description = "Exact fixed-point reference maths for Bush Protocol pools. Ported from balancer-maths (MIT)."
license = "MIT"
repository = "https://github.com/Bush-fi/bush-pool-factories"
homepage = "https://github.com/Bush-fi/bush-pool-factories/tree/main/maths/rust"
readme = "README.md"
keywords = ["defi", "amm", "bush", "fixed-point", "ethereum"]
categories = ["cryptography::cryptocurrencies", "mathematics"]
include = ["src/**/*", "README.md", "LICENSE", "Cargo.toml"]

[dependencies]
alloy-primitives = { version = "1.3.0", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
paste = "1.0"

[lib]
name = "bush_maths"
path = "src/lib.rs"
