# Publishes @bush.fi/maths to npm when a `maths-v*` tag is pushed (e.g. `maths-v0.1.0`).
#
# Release steps:
#   1. bump "version" in maths/typescript/package.json and commit
#   2. git tag maths-v<version> && git push origin maths-v<version>
#
# Needs an `NPM_TOKEN` repository secret (an npm automation token for the bush.fi org).
name: Publish @bush.fi/maths

on:
  push:
    tags: ['maths-v*']

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: maths/typescript
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: Check the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          [ "${GITHUB_REF_NAME}" = "maths-v${version}" ] || { echo "tag ${GITHUB_REF_NAME} != package version ${version}"; exit 1; }

      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
