[package]
name = "math-check"
version = "0.1.0"
edition = "2021"
publish = false
description = "Runs the Rust maths (maths/rust) against generated test data through the Vault flow"

[dependencies]
bush-maths = { path = "../../rust" }
alloy-primitives = { version = "1.3.0", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "math_check"
path = "src/main.rs"
