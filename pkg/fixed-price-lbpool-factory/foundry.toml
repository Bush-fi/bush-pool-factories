[profile.default]
src = 'contracts'
out = 'forge-artifacts'
libs = ['../../node_modules']
test = 'test/foundry'
cache_path = 'forge-cache'
allow_paths = ['../../', '../../node_modules/']
ffi = true
fs_permissions = [
    { access = "read", path = "./artifacts/" },
    { access = "read-write", path = "./.forge-snapshots/" },
]
remappings = [
    'ds-test/=../../node_modules/ds-test/src/',
    'forge-std/=../../node_modules/forge-std/src/',
    '@openzeppelin/=../../node_modules/@openzeppelin/',
    'permit2/=../../node_modules/permit2/',
    '@bush.fi/=../../node_modules/@bush.fi/',
    # The published Bush packages import each other by bare package prefix.
    'vault/=../../node_modules/@bush.fi/v3-vault/',
    'solidity-utils/=../../node_modules/@bush.fi/v3-solidity-utils/',
    'pool-utils/=../../node_modules/@bush.fi/v3-pool-utils/',
    'pool-weighted/=../../node_modules/@bush.fi/v3-pool-weighted/',
    'pool-stable/=../../node_modules/@bush.fi/v3-pool-stable/',
    'pool-hooks/=../../node_modules/@bush.fi/v3-pool-hooks/',
]
optimizer = true
optimizer_runs = 999
solc_version = '0.8.27'
auto_detect_solc = false
evm_version = 'cancun'
ignored_error_codes = [2394, 5574, 3860] # Transient storage, code size
allow_internal_expect_revert = true

[fuzz]
runs = 10000
max_test_rejects = 60000

[profile.coverage.fuzz]
runs = 100
max_test_rejects = 60000

[profile.intense.fuzz]
verbosity = 3
runs = 100000
max_test_rejects = 600000

[rpc_endpoints]
mainnet = "${MAINNET_RPC_URL}"
sepolia = "${SEPOLIA_RPC_URL}"
