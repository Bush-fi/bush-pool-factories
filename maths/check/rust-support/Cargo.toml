[package]
name = "math-check-support"
version = "0.1.0"
edition = "2021"
publish = false
description = "Runs a factory package's Rust maths implementation against bush-maths test data"

[dependencies]
bush-maths = { path = "../../../bush-maths/rust" }
alloy-primitives = { version = "1.3.0", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
