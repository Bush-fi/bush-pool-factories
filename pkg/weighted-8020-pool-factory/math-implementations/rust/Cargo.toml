[package]
name = "weighted-8020-pool-maths"
version = "0.1.0"
edition = "2021"
publish = false
description = "Exact fixed-point port of the pool deployed by weighted-8020-pool-factory"
license = "MIT"

[dependencies]
bush-maths = { path = "../../../../bush-maths/rust" }
alloy-primitives = { version = "1.3.0", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Only for the `math_check` binary used by pvt/math-check; not needed to use the library.
math-check-support = { path = "../../../../pvt/math-check/rust-support", optional = true }

[features]
math-check = ["dep:math-check-support"]

[[bin]]
name = "math_check"
path = "src/bin/math_check.rs"
required-features = ["math-check"]

[lib]
name = "weighted_8020_pool_maths"
path = "src/lib.rs"
